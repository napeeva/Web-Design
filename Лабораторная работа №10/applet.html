<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Java Applet</title>
</head>

<body>
    <h1>Пример Java-апплета</h1>

    <center>
    <applet code="SimpleApplet.class" width="200" height="100" alt="Ваш браузер не поддерживает Java">
    <param name="bgcolor" value="#FFD700">
    Если ваш браузер не поддерживает Java, вы увидите этот текст.
    </applet>
    </center>
</body>

</html>
