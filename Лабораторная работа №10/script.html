<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Приветствие</title>

    <script language="JavaScript">
    function displayMessage() {
        alert("Добро пожаловать на страницу");
    }
    </script>
</head>

<body onload="displayMessage()">
    <h1>Приветственная страница</h1>
    <p>Эта страница автоматически отображает приветственное сообщение при загрузке.</p>
</body>

</html>
