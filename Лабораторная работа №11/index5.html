<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 5</title>
</head>

<body>
    <h3>Опрос</h3>

    <form>
    Введите ваше имя: <input type="text" size="30">
    <br>
    <br>

    Что вам больше нравится?<br>
    <input type="checkbox" onClick="showStatus('учиться');"> Учиться<br>
    <input type="checkbox" onClick="showStatus('отдыхать');"> Отдыхать<br>
    <br>
    <input type="submit" value="Отправить">
    </form>

    <hr>
    Строка состояния: <b id="status"></b>

    <script language="JavaScript">
    function showStatus(choice) {
        var text = "Вы выбрали... " + choice;
        window.status = text;
        document.getElementById("status").innerHTML = text;
    }
    </script>
</body>
</html>
