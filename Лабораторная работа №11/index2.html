<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 2</title>
</head>

<body>
    <script language="JavaScript">
    var now = new Date();
    var day = now.getDate();
    var month = now.getMonth() + 1;
    var year = now.getFullYear();
    document.write("<font color='green'>Добро пожаловать на мою страницу!</font><br>");
    document.write("Сегодня " + day + "/" + month + "/" + year);
    </script>
</body>
