<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 9</title>
    <script language="JavaScript">

    function getDate() {
        var now = new Date();
        return now.getDate() + "/" + (now.getMonth() + 1) + "/" + now.getFullYear() + " " +
            now.getHours() + ":" + now.getMinutes() + ":" + now.getSeconds();
    }

    function showDate() {
        document.getElementById("box").value = getDate();
    }
    </script>
</head>

<body>
    <h3>Дата вызова функции</h3>
    <input type="text" id="box" size="30">
    <input type="button" value="Показать дату" onClick="showDate();">
</body>

</html>
