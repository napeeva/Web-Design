<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Опрос: компьютерная техника (страница 4 из 4)</title>
</head>

<body>
    <h2>Опрос: рынок сбыта компьютерной техники</h2>
    <h3>Страница 4 из 4. Выбор и покупка</h3>

    <form name="page4" action="spasibo.html" method="get">
        <b>Где вы обычно покупаете технику?</b>
        <br>
        <select name="shop">
        <option value="store">В магазине</option>
        <option value="online">В интернет-магазине</option>
        <option value="market">На маркетплейсе</option>
        <option value="used">Б/у, с рук</option>
        </select>
        <br>
        <br>

        <b>Что для вас важно при выборе? (можно выбрать несколько)</b>
        <br>
        <input type="checkbox" name="important" value="price"> Цена
        <input type="checkbox" name="important" value="brand"> Бренд
        <input type="checkbox" name="important" value="design"> Внешний вид
        <input type="checkbox" name="important" value="power"> Мощность
        <input type="checkbox" name="important" value="warranty"> Гарантия
        <br>
        <br>

        <b>Порекомендуете ли вы свою технику друзьям?</b>
        <br>
        <input type="radio" name="recommend" value="yes" checked> Да
        <input type="radio" name="recommend" value="no"> Нет
        <br>
        <br>

        <b>Ваши пожелания:</b>
        <br>
        <textarea name="comment" rows="5" cols="40"></textarea>
        <br>
        <br>

        <input type="submit" value="Отправить">
        <input type="reset" value="Очистить">
    </form>
</body>

</html>
