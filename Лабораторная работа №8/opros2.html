<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Опрос: компьютерная техника (страница 2 из 4)</title>
</head>

<body>
    <h2>Опрос: рынок сбыта компьютерной техники</h2>
    <h3>Страница 2 из 4. Ваша техника</h3>

    <form name="page2" action="opros3.html" method="get">
        <b>Что у вас есть сейчас? (можно выбрать несколько)</b>
        <br>
        <input type="checkbox" name="have" value="pc"> Стационарный компьютер
        <br>
        <input type="checkbox" name="have" value="laptop"> Ноутбук
        <br>
        <input type="checkbox" name="have" value="tablet"> Планшет
        <br>
        <input type="checkbox" name="have" value="printer"> Принтер
        <br>
        <br>

        <b>Для чего вы используете компьютер? (выберите один или несколько вариантов)</b>
        <br>
        <select name="purpose" size="4" multiple>
        <option value="study">Учёба</option>
        <option value="work">Работа</option>
        <option value="games">Игры</option>
        <option value="design">Дизайн и графика</option>
        <option value="internet">Интернет и общение</option>
        </select>
        <br>
        <br>

        <b>Как давно вы покупали технику?</b>
        <br>
        <select name="when">
        <option value="1">менее года назад</option>
        <option value="3">1-3 года назад</option>
        <option value="5">более 3 лет назад</option>
        </select>
        <br>
        <br>

        <input type="submit" value="Далее">
        <input type="reset" value="Очистить">
    </form>
</body>

</html>
