<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Опрос: компьютерная техника (страница 1 из 4)</title>
</head>

<body>
    <h2>Опрос: рынок сбыта компьютерной техники</h2>
    <h3>Страница 1 из 4. О вас</h3>

    <form name="page1" action="opros2.html" method="get">
        Ваше имя: <input type="text" name="name" size="30">
        <br><br>

        Возраст:
        <select name="age">
        <option value="u18">до 18 лет</option>
        <option value="18-25" selected>18-25 лет</option>
        <option value="26-35">26-35 лет</option>
        <option value="36-50">36-50 лет</option>
        <option value="50plus">старше 50 лет</option>
        </select>
        <br>
        <br>

        Пол:
        <input type="radio" name="gender" value="f" checked> Женский
        <input type="radio" name="gender" value="m"> Мужской
        <br>
        <br>

        Город:
        <select name="city">
        <option value="msk">Москва</option>
        <option value="spb">Санкт-Петербург</option>
        <option value="kzn">Казань</option>
        <option value="other">Другой</option>
        </select>
        <br>
        <br>

        <input type="submit" value="Далее">
        <input type="reset" value="Очистить">
    </form>
</body>

</html>
