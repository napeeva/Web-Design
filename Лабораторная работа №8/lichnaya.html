<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Личная форма</title>
</head>

<body>
    <h2>Личная</h2>

    <form name="lichnaya" action="spasibo.html" method="get">
        Имя: <input type="text" name="name" size="30">
        <br>
        <br>
        Фамилия: <input type="text" name="surname" size="30">
        <br>
        <br>
        Адрес: <input type="text" name="address" size="40">
        <br>
        <br>

        <b>Дата рождения:</b>
        <br>
        День (список):
        <select name="day">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="26">26</option>
        <option value="27">27</option>
        <option value="28">28</option>
        <option value="29">29</option>
        <option value="30">30</option>
        <option value="31">31</option>
        </select>
        <br>
        <br>
        Месяц (список с прокруткой):
        <select name="month" size="4">
        <option value="01">Январь</option>
        <option value="02">Февраль</option>
        <option value="03">Март</option>
        <option value="04">Апрель</option>
        <option value="05">Май</option>
        <option value="06">Июнь</option>
        <option value="07">Июль</option>
        <option value="08">Август</option>
        <option value="09">Сентябрь</option>
        <option value="10">Октябрь</option>
        <option value="11">Ноябрь</option>
        <option value="12">Декабрь</option>
        </select>
        <br>
        <br>
        Год (текстовое поле): <input type="text" name="year" size="4" maxlength="4">
        <br>
        <br>

        <b>Интересы (можно выбрать несколько):</b>
        <br>
        <input type="checkbox" name="interest" value="music"> Музыка
        <input type="checkbox" name="interest" value="sport"> Спорт
        <input type="checkbox" name="interest" value="art"> Искусство
        <input type="checkbox" name="interest" value="travel"> Путешествия
        <input type="checkbox" name="interest" value="computers"> Компьютеры
        <br><br>

        Username: <input type="text" name="username" size="20">
        <br>
        <br>
        Password: <input type="password" name="password" size="20">
        <br>
        <br>

        Комментарий:
        <br>
        <textarea name="comment" rows="5" cols="40"></textarea>
        <br>
        <br>

        <input type="submit" value="Отправить">
        <input type="reset" value="Очистить">
    </form>
    <hr>
    <a href="zachetka.html">Перейти на страницу «Зачётная книжка»</a>
    <br>
    <a href="opros1.html">Пройти опрос</a>
</body>

</html>
