<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Опрос: компьютерная техника (страница 3 из 4)</title>
</head>

<body>
    <h2>Опрос: рынок сбыта компьютерной техники</h2>
    <h3>Страница 3 из 4. Планы на покупку</h3>

    <form name="page3" action="opros4.html" method="get">
        <b>Что вы планируете купить?</b>
        <br>
        <select name="plan">
        <option value="none">Ничего</option>
        <option value="laptop">Ноутбук</option>
        <option value="pc">Стационарный компьютер</option>
        <option value="tablet">Планшет</option>
        <option value="monitor">Монитор</option>
        </select>
        <br>
        <br>

        <b>Какой бренд вы предпочитаете?</b>
        <br>
        <input type="radio" name="brand" value="apple"> Apple
        <input type="radio" name="brand" value="asus"> ASUS
        <input type="radio" name="brand" value="lenovo"> Lenovo
        <input type="radio" name="brand" value="hp"> HP
        <input type="radio" name="brand" value="any" checked> Не важно
        <br>
        <br>

        <b>Ваш бюджет:</b>
        <br>
        <select name="budget" size="4">
        <option value="30">до 30 000 руб.</option>
        <option value="60">30 000 - 60 000 руб.</option>
        <option value="100">60 000 - 100 000 руб.</option>
        <option value="100plus">более 100 000 руб.</option>
        </select>
        <br>
        <br>

        <input type="submit" value="Далее">
        <input type="reset" value="Очистить">
    </form>
</body>

</html>
